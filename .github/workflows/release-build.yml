name: FluxPDF Release Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fluxpdf-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Rust Engine & Android Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Install Required Android SDK Platforms & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" || true
          sdkmanager "build-tools;36.0.0" || true
          sdkmanager "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          else
            sdkmanager "ndk;27.2.12479018"
            NDK_DIR="$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
            echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          fi

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/fluxpdf-engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/fluxpdf-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Run Rust Engine Unit Tests
        working-directory: rust/fluxpdf-engine
        run: cargo test

      - name: Cross-Compile Rust Native Engine (libfluxpdf_engine.so)
        working-directory: rust/fluxpdf-engine
        run: |
          mkdir -p ../../app/src/main/jniLibs
          cargo ndk \
            -p 24 \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86_64 \
            -o ../../app/src/main/jniLibs \
            build --release
          ls -lh ../../app/src/main/jniLibs/*/libfluxpdf_engine.so

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Release Signing Keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "Using repository release signing secrets."
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "No signing secrets configured; generating valid CI release keystore for upload alias."
            CI_PASS="fluxpdf-ci-release-key"
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=FluxPDF CI, OU=Engineering, O=FluxPDF, L=Zurich, ST=ZH, C=CH"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run JVM Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.FluxPdfEngineTest" --no-daemon

      - name: Build Signed Release APK & AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Release Artifacts
        run: |
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxPDF-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxPDF-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
