name: FluxPDF Release Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fluxpdf-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Rust Engine & Android Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Preinstalled Android SDK, Licenses & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "build-tools;36.0.0" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            NDK_DIR="${ANDROID_NDK_LATEST_HOME}"
          else
            NDK_DIR="$(ls -d "${SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;27.2.12479018"
              NDK_DIR="$(ls -d "${SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
            fi
          fi
          echo "Using NDK: ${NDK_DIR}"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/fluxpdf-engine -> target"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Run Rust Engine Unit Tests
        working-directory: rust/fluxpdf-engine
        run: cargo test

      - name: Cross-Compile Rust Native Engine (libfluxpdf_engine.so)
        working-directory: rust/fluxpdf-engine
        run: |
          mkdir -p ../../app/src/main/jniLibs
          cargo ndk \
            -p 24 \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86_64 \
            -o ../../app/src/main/jniLibs \
            build --release
          ls -lh ../../app/src/main/jniLibs/*/libfluxpdf_engine.so

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Signing Keystores
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ] && [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
          fi

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "Using repository release signing secrets."
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "No signing secrets configured; generating valid CI release keystore for upload alias."
            CI_PASS="fluxpdf-ci-release-key"
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=FluxPDF CI, OU=Engineering, O=FluxPDF, L=Zurich, ST=ZH, C=CH"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run JVM Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.FluxPdfEngineTest" --no-daemon

      - name: Build Signed Release APK & AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify Release Artifacts
        run: |
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxPDF-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxPDF-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
